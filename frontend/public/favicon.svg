<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="lvl-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0512"/>
      <stop offset="100%" stop-color="#030106"/>
    </linearGradient>
    <linearGradient id="lvl-border" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#FF007F"/>
    </linearGradient>
    <linearGradient id="lvl-text" x1="12" y1="0" x2="52" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="60%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#FF007F"/>
    </linearGradient>
    <filter id="lvl-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fondo oscuro premium -->
  <rect width="64" height="64" rx="16" fill="url(#lvl-bg)"/>

  <!-- Borde neón gradiente cian-púrpura-rosa -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="13.5" stroke="url(#lvl-border)" stroke-width="3" fill="none"/>

  <!-- Acentos gaming en las esquinas -->
  <circle cx="16" cy="14" r="2.5" fill="#00E5FF"/>
  <circle cx="48" cy="14" r="2.5" fill="#FF007F"/>

  <!-- Texto LVL estilizado -->
  <text
    x="32"
    y="38"
    text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
    font-weight="900"
    font-size="21"
    font-style="italic"
    letter-spacing="-0.5"
    fill="url(#lvl-text)"
    filter="url(#lvl-glow)">
    LVL
  </text>

  <!-- Barra inferior UP neón -->
  <rect x="20" y="44" width="24" height="4" rx="2" fill="#00E5FF"/>
  <rect x="34" y="44" width="10" height="4" rx="2" fill="#FF007F"/>
</svg>