services:
  lvlup-postgres:
    image: postgres:16-alpine
    container_name: lvlup-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: lvlup_db
    ports:
      - "5432:5432"
    volumes:
      - lvlup_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lvlup_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  lvlup_pgdata:
    name: lvlup_pgdata
